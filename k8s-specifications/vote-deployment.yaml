apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - image: 410244642625.dkr.ecr.ap-southeast-1.amazonaws.com/voting-app-vote:replace-me
          name: vote
          env:
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 80
              name: vote
