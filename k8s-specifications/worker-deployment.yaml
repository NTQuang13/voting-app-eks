apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - image: 410244642625.dkr.ecr.ap-southeast-1.amazonaws.com/voting-app-worker:replace-me
          name: worker
          env:
            - name: REDIS_HOST
              value: redis
            - name: DB_HOST
              value: db
            - name: DB_USER
              value: postgres
            - name: DB_NAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
